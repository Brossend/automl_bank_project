stages:
  - quality
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

cache:
  paths:
    - .cache/pip

.python-job:
  image: python:3.11
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - pip install poetry==2.5.1
    - poetry install --no-interaction

quality:
  extends: .python-job
  stage: quality
  script:
    - poetry run ruff check .
    - poetry run ruff format --check .
    - poetry run mypy src

tests:
  extends: .python-job
  stage: test
  script:
    - mkdir -p reports/tables
    - poetry run python -m pytest --junitxml=reports/tables/pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: reports/tables/pytest-report.xml
    paths:
      - reports/tables/pytest-report.xml
    expire_in: 1 week

docker-build:
  image: docker:24
  stage: build
  services:
    - name: docker:24-dind
      alias: docker
  script:
    - docker version
    - docker build -t automl-bank-marketing .
