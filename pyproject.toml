[project]
name = "automl-bank-project"
version = "0.1.0"
description = "Reproducible ML pipeline for the UCI Bank Marketing dataset"
authors = [{ name = "Иван Лямцев" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "optuna>=3.5",
    "mlflow>=2.10",
    "psutil>=5.9",
]

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = "^0.16.10"
mypy = ">=1.15"
pre-commit = ">=4.0"
types-psutil = ">=7.0"
pandas-stubs = ">=2.2"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".idea", "mlruns"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["mlruns"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "joblib",
    "matplotlib",
    "matplotlib.*",
    "mlflow",
    "mlflow.*",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
